# Runs on every pull request and every push to main: lint, unit tests, the full build (which also checks that every
# Vercel function loads the way Vercel loads it), and the integration tests against a real Postgres.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uscale
          POSTGRES_PASSWORD: uscale
          POSTGRES_DB: uscale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uscale" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://uscale:uscale@localhost:5432/uscale_test
